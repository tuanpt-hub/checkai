<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>AI Brand Readiness Audit – NetSpace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F1F3F7;--solid:#FFFFFF;--field:#FFFFFF;--tint:#F6F7FA;--line:#E7E9F0;--line2:#D3D8E2;--text:#1A2233;--muted:#6B7385;--accent:#2F6FED;--danger:#D9432F;--ok:#23915F;--warn:#B7791F;
--l1:#2F6FED;--l2:#22A6B8;--l3:#58B368;--l4:#F2B134;--l5:#EF6F5B;--l6:#7C6FE0;--shadow:0 1px 2px rgba(16,24,40,.06),0 2px 6px rgba(16,24,40,.04);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:18px 14px 64px}
h1{font-size:clamp(18px,3vw,22px);line-height:1.2;font-weight:700;margin:0;letter-spacing:-.01em}
h1 span,h2 span{font-weight:400}
h2{font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:-.005em}
h3{font-size:16px;font-weight:600;margin:0}
p{margin:0 0 10px;max-width:74ch}
.muted{color:var(--muted)} .small{font-size:13px}
.appbar{background:var(--solid);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:16px 20px}
.brand{display:flex;align-items:center;gap:12px}
.mark{position:relative;width:38px;height:38px;border-radius:50%;flex:none;background:conic-gradient(var(--l1) 0 34%,var(--l2) 34% 58%,var(--l3) 58% 76%,var(--l4) 76% 90%,var(--l5) 90% 100%)}
.mark::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--solid)}
.mark i{display:none}
.top .sub{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],textarea{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:9px 12px}
select:hover,input[type=text]:hover,textarea:hover{border-color:#B4BBCB}
select:focus,input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.18)}
textarea{resize:vertical;min-height:72px}
select{width:auto;max-width:100%;font-size:14px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
label span{font-weight:400;color:var(--muted)}
button{cursor:pointer;border:1px solid var(--line2);background:var(--solid);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px}
button:hover:not(:disabled){background:var(--tint);border-color:#B4BBCB}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:#2459C9;border-color:#2459C9}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.steps{display:flex;gap:4px;overflow-x:auto;padding:0 12px;border-top:1px solid var(--line);scrollbar-width:none}
nav.steps::-webkit-scrollbar{display:none}
nav.steps button{display:flex;align-items:center;gap:8px;white-space:nowrap;border:0;border-radius:0;background:transparent;color:var(--muted);padding:13px 10px 11px;font-weight:500;border-bottom:2px solid transparent}
nav.steps button:hover:not(:disabled){background:transparent;color:var(--text)}
nav.steps .sn{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--tint);border:1px solid var(--line)}
nav.steps small{display:none}
nav.steps button[aria-current=true]{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
nav.steps button[aria-current=true] .sn{background:var(--accent);border-color:var(--accent);color:#fff}
/* KPI row */
.kpirow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpirow[hidden]{display:none}
.kcard{display:block;text-align:left;background:var(--solid);border:0;border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.kcard:hover:not(:disabled){background:var(--solid);box-shadow:0 2px 4px rgba(16,24,40,.08),0 6px 16px rgba(16,24,40,.08)}
.khead{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:500}
.khead u{text-decoration:none;color:var(--accent);font-size:17px;line-height:1}
.kval{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:6px 0 4px}
.kval b{font-size:clamp(26px,4vw,34px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kval em{font-style:normal;font-size:13.5px;font-weight:600}
.kcard small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* cards */
.panel{background:var(--solid);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin:14px 0;min-width:0}
.panel>h2:first-child{margin:-20px -20px 16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin:14px 0}
.cols>.panel{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:0 20px}
.note{background:#EEF4FF;border-radius:10px;padding:11px 14px;font-size:13.5px;margin:12px 0;color:#24406F}
.err{color:var(--danger);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:500;background:var(--tint);border:1px solid var(--line);white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--line2);vertical-align:-1px}
.wi{color:var(--l4);font-size:.9em;margin-left:6px}
/* overview */
.heroGrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px 34px;align-items:center}
.heroGrid>*{min-width:0}
@media (min-width:760px){.heroGrid{grid-template-columns:minmax(220px,4fr) 7fr}.heroGrid>:first-child{border-right:1px solid var(--line);padding-right:30px}}
.bigwrap{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-size:clamp(44px,7vw,60px);font-weight:600;line-height:1;letter-spacing:-.03em}
.bigwrap span{font-size:15px;color:var(--muted)}
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;margin:10px 0 8px}
.lvl::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.scale{position:relative;display:flex;gap:3px;margin:16px 0 6px}
.scale div{height:8px;border-radius:4px;background:#E9ECF2}
.scale div.on{background:var(--l2)}
.scale u{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--solid);border:3px solid var(--accent);transform:translateX(-8px)}
.scaleLab{display:flex;gap:3px;font-size:11.5px;color:var(--muted)}
.scaleLab span{min-width:0;line-height:1.25}
.scaleLab span.on{color:var(--text);font-weight:600}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,2vw,22px);align-items:end}
.col{text-align:center;min-width:0}
.colbar{position:relative;height:190px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:repeating-linear-gradient(to top,transparent 0 46.5px,var(--line) 46.5px 47.5px)}
.colbar i{display:block;width:min(100%,46px);min-height:3px;border-radius:5px 5px 0 0;background:var(--c);transition:height .6s cubic-bezier(.2,.7,.2,1)}
.colbar span{font-size:13px;font-weight:600;margin-bottom:5px}
.col b{display:block;font-size:13px;font-weight:600;margin-top:8px}
.col small{display:block;font-size:11.5px;color:var(--muted);line-height:1.25}
@media (prefers-reduced-motion:reduce){.colbar i,.track i{transition:none}}
/* list rows */
.rows{margin:-6px -20px -12px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:nth-child(even){background:#FAFBFC}
.ico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--accent));color:#fff;font-size:12px;font-weight:700;line-height:1;margin-top:2px}
.ico.sq{border-radius:5px}
.rmain b{font-weight:500;font-size:15px}
.rmain small{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:2px}
.rside{text-align:right;font-weight:600;font-size:14px;white-space:nowrap}
.rside small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.up{color:var(--ok)} .down{color:var(--danger)} .mid{color:var(--warn)}
.empty{color:var(--muted);font-size:14px;margin:0}
/* rings */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:18px 10px;justify-items:center;text-align:center}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;background:conic-gradient(var(--c) calc(var(--p)*1%),#E9ECF2 0)}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--solid);display:flex;align-items:baseline;justify-content:center;gap:1px;padding-top:19px;font-size:21px;font-weight:500;line-height:1.3}
.ring small{font-size:11px;color:var(--muted)}
.ringbox b{display:block;font-size:13.5px;font-weight:500}
.ringbox>small{color:var(--muted);font-size:12px}
.track{height:8px;border-radius:4px;background:#E9ECF2;margin:5px 0 3px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--c);transition:width .5s ease}
/* criteria */
details.layer{background:var(--solid);border-radius:14px;box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
details.layer>summary{list-style:none;cursor:pointer;padding:15px 20px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
details.layer>summary:hover{background:#FAFBFC}
details.layer>summary::-webkit-details-marker{display:none}
.lnum{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:color-mix(in srgb,var(--c) 16%,#fff);color:color-mix(in srgb,var(--c) 62%,#10192E)}
.lmeta{display:grid;grid-template-columns:auto 90px;gap:2px 10px;align-items:center;text-align:right}
.lmeta b{font-size:16px;font-weight:600}
.lmeta .track{margin:0}
.lmeta span{grid-column:1/-1}
.crit{border-top:1px solid var(--line);padding:16px 20px}
.crit h4{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cid{background:color-mix(in srgb,var(--c) 16%,#fff);color:color-mix(in srgb,var(--c) 62%,#10192E);font-weight:600;font-size:12.5px;border-radius:6px;padding:1px 7px}
.seg{display:inline-flex;gap:6px;margin:10px 0}
.seg button{width:40px;height:38px;padding:0;border-radius:8px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button:last-child[aria-pressed=true]{background:var(--tint);border-color:var(--line2);color:var(--muted)}
.crit details{font-size:13.5px;margin:6px 0}
.crit details summary{cursor:pointer;color:var(--accent);font-weight:500}
.sugg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;margin:8px 0;padding:8px 10px;border-radius:8px;background:#FFF8E6}
.sugg .chip{background:#fff;border-color:#F0DCA6}
.sugg button{padding:3px 10px;font-size:12.5px}
.tblwrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:500}
td.c,th.c{text-align:center;white-space:nowrap}
pre{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;font-size:12.5px;white-space:pre-wrap;word-break:break-word;margin:10px 0}
.out{white-space:pre-wrap;background:var(--tint);border-radius:10px;padding:14px 16px;margin:10px 0;font-size:14.5px;line-height:1.65}
.prio{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:1px 7px;font-weight:600;font-size:12px;color:#fff;background:var(--danger)}
.prio.p1{background:var(--warn)}
@media (max-width:760px){
.kpirow{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:14px;gap:10px;margin:0 -14px 14px;padding:2px 14px 6px;scrollbar-width:none}
.kpirow::-webkit-scrollbar{display:none}
.kcard{flex:0 0 160px;scroll-snap-align:start;padding:12px 14px}
.kval b{font-size:26px}
.panel{padding:16px}.panel>h2:first-child{margin:-16px -16px 14px;padding:14px 16px}.rows{margin:-4px -16px -10px}.row{padding:11px 16px}.top{padding:14px 16px}
.colbar{height:150px;background:repeating-linear-gradient(to top,transparent 0 36.5px,var(--line) 36.5px 37.5px)}.col small{display:none}
.lmeta{grid-template-columns:auto}.lmeta .track{display:none}
.scaleLab{display:none}
details.fold>summary{padding:14px 16px}.fold-body{padding:0 16px 16px}
.crit{padding:14px 16px}details.layer>summary{padding:14px 16px}
.ptable thead{display:none}
.ptable,.ptable tbody{display:block;width:100%}
.ptable tr{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.ptable td{border:0;padding:0}
.ptable td.id{flex:0 0 30px}
.ptable td.q{flex:1 1 calc(100% - 44px);min-width:0}
.ptable td.e0{margin-left:44px}
.ptable td.eng{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ptable td.eng::after{content:attr(data-l);font-size:12px;color:var(--muted)}
}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
@media (max-width:700px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.fgrid .full{grid-column:1/-1}
details.fold{background:var(--solid);border-radius:14px;box-shadow:var(--shadow);margin:14px 0}
details.fold>summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:18px;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary span{font-weight:400;font-size:13.5px;color:var(--muted)}
details.fold>summary::after{content:"▾";color:var(--muted);transition:transform .2s;flex:none}
details.fold[open]>summary::after{transform:rotate(180deg)}
details.fold[open]>summary{border-bottom:1px solid var(--line)}
.fold-body{padding:16px 20px 20px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px;align-items:center;font-size:13px;color:var(--muted)}
.legend .chip b{margin-right:2px}
.codehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 0}
pre.code{white-space:pre;word-break:normal;overflow:auto;max-height:340px;margin:8px 0 0;font-size:12.5px;line-height:1.5}
.lv0,.lv1{color:var(--danger)}.lv2{color:var(--warn)}.lv3,.lv4{color:var(--ok)}
.kcard .khead,.kcard .kval{display:flex}
.kcard .kval{display:flex}
.morebtn{display:block;margin:14px auto 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 4px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:24px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.kpi span{font-size:12.5px;color:var(--muted)}
.ptable td.id{font-weight:700}
input[type=password]{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:9px 12px}
input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.18)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login[hidden],#app[hidden]{display:none}
.lcard{width:100%;max-width:410px;background:var(--solid);border-radius:16px;box-shadow:0 2px 6px rgba(16,24,40,.06),0 14px 40px rgba(16,24,40,.08);padding:28px}
.lcard .brand{margin-bottom:14px}
.lcard .err{min-height:22px;margin:10px 0 0;font-size:14px}
.userbox{display:inline-flex;align-items:center;gap:4px;margin-left:2px}
.userbox .chip{max-width:200px;overflow:hidden;text-overflow:ellipsis}
.engrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 6px}
.engchip{display:flex;gap:10px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--solid);margin:0;font-weight:500}
.engchip input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.engchip b{font-weight:600}
.engchip small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.engchip.off{opacity:.55;cursor:not-allowed}
.opts{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;margin:8px 0 14px;font-size:14px}
.opts label{display:inline-flex;align-items:center;gap:8px;margin:0;font-weight:500}
.opts input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.opts select{padding:6px 10px}
.pbar{height:8px;border-radius:4px;background:#D6E2FA;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.bline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note.okbox{background:#EAF8F0;color:#145A38}
.note.warnbox{background:#FFF4E0;border-left:4px solid var(--warn);color:#5C3A00}
.srcs{font-size:12.5px;margin:4px 0;color:var(--muted)}
.srcs a{color:var(--accent);text-decoration:none}
.srcs a:hover{text-decoration:underline}
.cost{font-size:13px;color:var(--muted);margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.pbar i{transition:none}}
</style>
</head>
<body>
<div id="boot" class="login"><p class="muted">Đang tải…</p></div>
<div id="login" class="login" hidden>
  <form class="lcard" id="lgForm">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>AI Brand Readiness <span>Audit</span></h1></div>
    <p class="muted small">Công cụ nội bộ NetSpace. Đăng nhập bằng tài khoản được cấp.</p>
    <label for="lgEmail">Email</label><input type="text" inputmode="email" autocomplete="username" id="lgEmail" spellcheck="false">
    <label for="lgPass">Mật khẩu</label><input type="password" autocomplete="current-password" id="lgPass">
    <p class="err" id="loginErr" role="alert"></p>
    <button class="primary" id="lgBtn" type="submit" style="width:100%;margin-top:6px;padding:11px 14px">Đăng nhập</button>
  </form>
</div>
<div id="app" hidden>
<div class="wrap">
  <header class="appbar">
    <div class="top">
      <div class="brand"><span class="mark" aria-hidden="true"></span><h1>AI Brand Readiness <span>Audit</span></h1></div>
      <div class="bar"><select id="auditSel" aria-label="Chọn audit"></select><button id="newAudit">Tạo audit mới</button><button id="impBtn" class="ghost">Nhập</button><button id="delAudit" class="ghost">Xóa</button><span id="saveState" class="small muted" role="status"></span><span class="userbox"><span id="userChip" class="chip"></span><button id="logoutBtn" class="ghost">Đăng xuất</button></span><input type="file" id="impFile" accept=".json,application/json" hidden></div>
    </div>
    <nav class="steps" id="steps" aria-label="Các bước audit"></nav>
  </header>
  <section class="kpirow" id="pulse" aria-label="Chỉ số chính" hidden></section>
  <main id="view"></main>
</div>
</div>
<script>
const M={"layers": [{"n": 1, "en": "DISCOVERABLE", "vi": "Tìm thấy", "q": "AI có tìm thấy bạn không?", "w": 15, "color": "0EA5E9", "goal": "Mọi nguồn thông tin chính thức của thương hiệu đều truy cập, thu thập và lập chỉ mục được bởi công cụ tìm kiếm và AI crawler; thông tin còn mới.", "out": "Bản đồ Knowledge Footprint + danh sách lỗi truy cập kỹ thuật"}, {"n": 2, "en": "IDENTIFIABLE", "vi": "Nhận diện đúng", "q": "AI có biết chính xác bạn là ai không?", "w": 15, "color": "3B82F6", "goal": "Máy gắn đúng công ty = thương hiệu = website = sản phẩm = lãnh đạo, không lẫn với thực thể trùng tên.", "out": "Entity Map + bộ định danh chuẩn (Brand Truth Sheet, JSON-LD Organization)"}, {"n": 3, "en": "UNDERSTANDABLE", "vi": "Hiểu đúng", "q": "AI có hiểu bạn làm gì không?", "w": 20, "color": "6366F1", "goal": "AI mô tả đúng bạn bán gì, cho ai, ở đâu, giá nào, khác gì — bằng ngôn ngữ rõ nghĩa thay vì khẩu hiệu.", "out": "Câu định vị chuẩn + khoảng cách giữa mô tả mong muốn và mô tả của AI"}, {"n": 4, "en": "VERIFIABLE", "vi": "Kiểm chứng", "q": "AI có kiểm chứng được những gì bạn nói không?", "w": 20, "color": "9B5DE5", "goal": "Mỗi claim quan trọng có ít nhất hai nguồn độc lập xác nhận; số liệu nhất quán giữa các nguồn.", "out": "Claim Inventory: claim nào đã có evidence, claim nào mới là tự công bố"}, {"n": 5, "en": "AUTHORITATIVE", "vi": "Thẩm quyền", "q": "Trong chủ đề nào bạn có thẩm quyền?", "w": 15, "color": "E8558A", "goal": "Thương hiệu được nhắc và trích dẫn ở đúng các chủ đề chuyên môn muốn sở hữu, không chỉ ở tin tuyển dụng, CSR, sự kiện.", "out": "Topic Authority Map (10 chủ đề) + Authority Gap"}, {"n": 6, "en": "RECOMMENDABLE", "vi": "Đề xuất", "q": "AI có đủ lý do để đề xuất bạn không?", "w": 15, "color": "F07B50", "goal": "Trong các tình huống mua hàng cụ thể, AI có đủ dữ liệu về đặc tính, giá, đánh giá, tính sẵn sàng để chọn bạn thay vì đối thủ.", "out": "Recommendation Rate trên 20 tình huống + danh sách dữ liệu quyết định còn thiếu"}], "criteria": [{"id": "1.1", "layer": 1, "name": "Quyền truy cập của AI crawler", "check": "robots.txt và tường lửa có cho phép các bot AI chính đọc website không?", "how": "Mở domain/robots.txt; tìm các user-agent GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, PerplexityBot, Googlebot, Bingbot và token Google-Extended. Kiểm tra CDN/WAF có chặn bot không (xem log hoặc hỏi IT).", "hi": "Cho phép rõ ràng các bot tìm kiếm AI; không có lệnh Disallow: / chung; WAF không chặn.", "lo": "Chặn toàn bộ hoặc chặn các bot tìm kiếm AI; không có robots.txt và WAF trả 403.", "fix": "Cập nhật robots.txt theo mẫu ở Phụ lục B; mở whitelist bot trên CDN/WAF; quyết định riêng về bot huấn luyện (GPTBot, Google-Extended).", "owner": "Tech", "mode": "Thủ công"}, {"id": "1.2", "layer": 1, "name": "Khả năng đọc & lập chỉ mục kỹ thuật", "check": "Nội dung chính có nằm trong HTML trả về từ server, có sitemap, HTTPS, tốc độ ổn không?", "how": "Xem nguồn trang (View Source) hoặc curl: nội dung chính có sẵn trong HTML không. Kiểm tra /sitemap.xml, mã trạng thái 200, canonical, PageSpeed Insights.", "hi": "Nội dung render phía server; sitemap đầy đủ và mới; không lỗi 4xx/5xx; Core Web Vitals đạt.", "lo": "Nội dung chỉ hiện sau khi chạy JavaScript; không sitemap; nhiều trang lỗi.", "fix": "Bật SSR/prerender cho trang chính; tạo và khai báo sitemap.xml; sửa lỗi crawl trong Search Console và Bing Webmaster Tools.", "owner": "Tech", "mode": "Thủ công"}, {"id": "1.3", "layer": 1, "name": "Độ phủ chỉ mục trên Google và Bing", "check": "Các trang quan trọng có nằm trong chỉ mục Google và Bing không?", "how": "Truy vấn site:domain trên Google và Bing; đối chiếu số trang với sitemap. Tìm tên thương hiệu và tên pháp lý: website chính thức đứng thứ mấy?", "hi": "Website chính thức đứng đầu khi tìm tên thương hiệu trên cả Google và Bing; trên 90% trang quan trọng được index.", "lo": "Tìm tên thương hiệu không ra website chính thức ở trang 1; Bing gần như không index.", "fix": "Xác minh domain trên Google Search Console và Bing Webmaster Tools; gửi sitemap; dùng IndexNow; bổ sung liên kết từ kênh chính thức về website.", "owner": "Tech", "mode": "Thủ công"}, {"id": "1.4", "layer": 1, "name": "Knowledge footprint ngoài website", "check": "Thương hiệu có mặt ở những nguồn AI hay tham chiếu không?", "how": "Rà 10 nhóm nguồn trong sheet Entity Map: báo chí, Wikipedia/Wikidata, LinkedIn, Google Business Profile, danh bạ doanh nghiệp, nền tảng review, đối tác, diễn đàn, YouTube, marketplace.", "hi": "Có hồ sơ đầy đủ ở ít nhất 8/10 nhóm nguồn phù hợp với ngành.", "lo": "Chỉ có website và một trang mạng xã hội.", "fix": "Lập và hoàn thiện hồ sơ ở các nguồn còn thiếu theo thứ tự: Google Business Profile, LinkedIn, danh bạ ngành, Wikidata (khi đủ điều kiện nổi bật).", "owner": "PR", "mode": "Thủ công"}, {"id": "1.5", "layer": 1, "name": "Độ mới của thông tin", "check": "Thông tin trên các kênh chính có được cập nhật trong 12 tháng gần nhất không?", "how": "Ghi ngày cập nhật gần nhất của trang Giới thiệu, trang sản phẩm, hồ sơ mạng xã hội, bài báo mới nhất. Đối chiếu số liệu (nhân sự, khách hàng, địa chỉ) với thực tế.", "hi": "Mọi kênh chính cập nhật trong 6 tháng; không còn số liệu, địa chỉ, nhân sự cũ.", "lo": "Trang Giới thiệu và hồ sơ công ty cũ trên 2 năm; còn thông tin đã sai.", "fix": "Đặt lịch rà soát hàng quý; gỡ hoặc cập nhật trang cũ; ghi ngày cập nhật rõ trên trang.", "owner": "Content", "mode": "Thủ công"}, {"id": "1.6", "layer": 1, "name": "AI có trả lời được khi hỏi thẳng tên", "check": "Khi hỏi trực tiếp tên thương hiệu, các AI phổ biến có trả lời được không?", "how": "Chạy nhóm prompt B (B1–B6) trên ChatGPT, Gemini, Perplexity, Copilot, Claude. Ghi vào sheet AI Prompt Log. Web app tự chạy phần Claude.", "hi": "Cả 5 AI nhận ra thương hiệu và trả lời có nội dung, kèm nguồn.", "lo": "Đa số AI trả lời không biết, hoặc trả lời về một công ty khác.", "fix": "Ưu tiên sửa 1.1–1.4 trước; bổ sung nguồn độc lập có tên thương hiệu đầy đủ.", "owner": "Brand", "mode": "AI Probe"}, {"id": "2.1", "layer": 2, "name": "Tên gọi nhất quán", "check": "Tên pháp lý, tên thương hiệu, tên viết tắt, tên lãnh đạo có được viết giống nhau ở mọi nơi không?", "how": "Thu thập cách viết tên trên website, mạng xã hội, 10 bài báo gần nhất, hồ sơ đối tác. Điền sheet Entity Map. Trong web app: dán các đoạn mô tả để AI so khớp.", "hi": "Một cách viết duy nhất cho mỗi tên; biến thể được khai báo là alternateName.", "lo": "Từ 4 biến thể trở lên cho cùng một tên; tên lãnh đạo, chức danh khác nhau giữa các nguồn.", "fix": "Ban hành Brand Truth Sheet (tên chuẩn, biến thể được phép); gửi kèm mọi thông cáo; yêu cầu đối tác và báo chí sửa các trang có lượng truy cập cao.", "owner": "Brand", "mode": "AI phân tích"}, {"id": "2.2", "layer": 2, "name": "Dữ liệu có cấu trúc về tổ chức", "check": "Website có JSON-LD Organization với name, legalName, url, logo, sameAs, founder, address không?", "how": "Dán URL trang chủ vào Schema Markup Validator hoặc Rich Results Test. Kiểm tra từng thuộc tính.", "hi": "Organization đầy đủ, hợp lệ, sameAs trỏ tới mọi kênh chính thức, có taxID/địa chỉ.", "lo": "Không có schema hoặc schema lỗi.", "fix": "Dùng công cụ sinh JSON-LD trong web app; gắn vào trang chủ và trang Giới thiệu; kiểm tra lại bằng validator.", "owner": "Tech", "mode": "Thủ công"}, {"id": "2.3", "layer": 2, "name": "Quan hệ thực thể rõ ràng", "check": "Quan hệ công ty mẹ – công ty con – thương hiệu – sản phẩm – lãnh đạo có được công bố rõ không?", "how": "Đọc trang Giới thiệu và các bài báo: có câu nào nêu rõ ai sở hữu ai, sản phẩm nào thuộc công ty nào, ai giữ chức danh gì. Hỏi AI prompt B3 và so với thực tế.", "hi": "Có trang cấu trúc tổ chức/hệ sinh thái; mỗi sản phẩm có trang riêng ghi rõ chủ sở hữu; AI trả lời đúng.", "lo": "Quan hệ chỉ xuất hiện rải rác trên báo; AI trả lời sai hoặc không biết.", "fix": "Viết trang Về chúng tôi dạng dữ kiện: công ty, hệ sinh thái, sản phẩm, lãnh đạo; khai báo parentOrganization, subOrganization, brand, founder trong schema.", "owner": "Brand", "mode": "AI Probe"}, {"id": "2.4", "layer": 2, "name": "Kênh chính thức được xác minh và liên kết chéo", "check": "Website có liên kết tới mọi kênh chính thức và ngược lại; kênh có tích xác minh không?", "how": "Kiểm tra footer website, phần giới thiệu của từng kênh mạng xã hội, tích xanh, liên kết ngược về website.", "hi": "Liên kết hai chiều đầy đủ; kênh chính đã xác minh; không có trang giả mạo nổi bật.", "lo": "Kênh không dẫn về website; có trang trùng tên không rõ chính chủ.", "fix": "Bổ sung liên kết hai chiều; đăng ký xác minh; báo cáo trang giả mạo.", "owner": "Content", "mode": "Thủ công"}, {"id": "2.5", "layer": 2, "name": "Không bị nhầm với thực thể khác", "check": "AI và công cụ tìm kiếm có lẫn thương hiệu với tổ chức trùng tên không?", "how": "Tìm tên thương hiệu không kèm ngữ cảnh trên Google, Bing và hỏi AI. Đếm kết quả thuộc về thực thể khác ở trang 1.", "hi": "Kết quả trang 1 và câu trả lời AI đều về đúng thương hiệu.", "lo": "AI trả lời về công ty khác; trang 1 đa số là thực thể trùng tên.", "fix": "Luôn dùng tên kèm định danh phân biệt (ngành + quốc gia) trong tiêu đề, mô tả, thông cáo; tăng nguồn có tên pháp lý đầy đủ; tạo mục Wikidata.", "owner": "Brand", "mode": "AI Probe"}, {"id": "2.6", "layer": 2, "name": "Định danh pháp lý nhất quán", "check": "Mã số thuế, địa chỉ, hotline, email có trùng khớp trên website, cổng đăng ký doanh nghiệp và danh bạ không?", "how": "So sánh thông tin trên website với Cổng thông tin quốc gia về đăng ký doanh nghiệp, Google Business Profile và 3 danh bạ doanh nghiệp.", "hi": "Khớp 100% trên mọi nguồn; website hiển thị đủ MST, địa chỉ, người đại diện.", "lo": "Địa chỉ hoặc số điện thoại khác nhau giữa các nguồn; website không có thông tin pháp lý.", "fix": "Chuẩn hóa NAP; cập nhật danh bạ; thêm khối thông tin pháp lý ở footer.", "owner": "Tech", "mode": "Thủ công"}, {"id": "3.1", "layer": 3, "name": "Câu định vị một câu", "check": "Trang chủ có một câu nói rõ: bán gì, cho ai, ở đâu không?", "how": "Đọc 100 chữ đầu trang chủ và t const SEED={"id": "netspace-pilot", "updated": 1794531600000, "profile": {"brand": "NetSpace", "legal": "Công ty Cổ phần Công nghệ & Truyền thông Không Gian Số", "aliases": "Netspace; NETSPACE; Không gian số", "website": "https://netspace.vn", "channels": "https://www.facebook.com/netspaceco\nhttps://www.linkedin.com/company/netspaceco/", "category": "công nghệ và truyền thông số (mạng lưới MCN, KOL/KOC, nền tảng nội dung số)", "market": "Việt Nam", "oneliner": "NetSpace là công ty công nghệ và truyền thông số Việt Nam, vận hành các nền tảng nội dung số và mạng lưới kênh/KOL, cung cấp dịch vụ truyền thông thương hiệu cho doanh nghiệp.", "products": "Nền tảng nội dung số gnm.vn (Góc Nhìn Mới); đối tác công nghệ của Cổng thông tin KOL kol.gov.vn; mạng lưới MCN và quản lý KOL/KOC; sản xuất nội dung thương hiệu; tư vấn AI Brand Readiness", "audience": "Doanh nghiệp, thương hiệu và cơ quan, tổ chức tại Việt Nam cần truyền thông số và nền tảng nội dung", "leaders": "Nguyễn Văn Tuấn – Tổng Giám đốc; Nguyễn Đình Thành – Phó Tổng Giám đốc", "claims": "Đối tác công nghệ của Cổng thông tin và Cơ sở dữ liệu KOL kol.gov.vn (Cục PTTH&TTĐT)\nVận hành mạng lưới MCN hơn 100 kênh\nHơn 10 triệu followers trên toàn mạng lưới\nHơn 300 triệu lượt xem mỗi tháng\nĐội ngũ chuyên gia hơn 20 năm kinh nghiệm\nNhà tài trợ chính Giải bóng đá 7 người VĐQG NetSpace Cup 2026\nHợp tác với TIMC đào tạo KOL, KOC và nghiệp vụ livestream", "topics": "AI Brand Readiness – thương hiệu máy đọc được (GEO/AEO)\nQuản lý và xác thực KOL/KOC\nCơ sở dữ liệu và đo lường người có ảnh hưởng\nMạng lưới đa kênh MCN\nTòa soạn hội tụ và nền tảng CMS báo chí\nLivestream bán hàng và đào tạo livestream\nQuy định pháp luật về quảng cáo của người có ảnh hưởng\nNội dung thương hiệu và MV thương hiệu\nChuyển đổi số doanh nghiệp truyền thông\nTruyền thông thể thao phong trào", "scenarios": "Tôi là CMO một ngân hàng, cần đơn vị kiểm tra xem ChatGPT và Gemini đang mô tả thương hiệu của tôi thế nào và đề xuất cách sửa. Nên chọn ai ở Việt Nam?\nCông ty tôi muốn làm audit mức độ sẵn sàng của thương hiệu với AI search, ngân sách khoảng 200 triệu đồng. Gợi ý đơn vị tư vấn tại Việt Nam.\nTôi cần một MCN tại Việt Nam quản lý trên 50 kênh mạng xã hội cho chiến dịch ra mắt sản phẩm tiêu dùng. Đề xuất đơn vị.\nThương hiệu mỹ phẩm của tôi cần chọn KOC đã được xác thực, tránh rủi ro quảng cáo sai sự thật. Nên làm việc với đơn vị nào?\nTôi muốn tra cứu độ uy tín của một KOL trước khi ký hợp đồng quảng cáo tại Việt Nam. Dùng nguồn nào, đơn vị nào hỗ trợ?\nDoanh nghiệp tôi cần sản xuất một MV thương hiệu để phát trên YouTube và TikTok. Gợi ý đơn vị sản xuất tại Hà Nội.\nTòa soạn của tôi cần nền tảng CMS hội tụ để xuất bản đa kênh. Đơn vị công nghệ nào tại Việt Nam có kinh nghiệm?\nTôi cần đối tác vừa làm công nghệ vừa làm truyền thông để xây cổng thông tin cho một cơ quan nhà nước. Đề xuất đơn vị tại Việt Nam.\nCông ty bất động sản của tôi muốn chiến dịch truyền thông số kết hợp báo chí, mạng xã hội và KOL trong 3 tháng. Nên chọn agency nào?\nTôi muốn đào tạo đội ngũ livestream bán hàng bài bản cho 30 nhân viên. Đơn vị nào tại Việt Nam có chương trình đạt chuẩn?\nThương hiệu tôi muốn tài trợ giải thể thao phong trào và cần đối tác truyền thông khai thác quyền tài trợ. Gợi ý đơn vị.\nTôi cần đơn vị đo lường hiệu quả chiến dịch KOL bằng dashboard thời gian thực. Ai làm được tại Việt Nam?\nDoanh nghiệp tôi bị AI mô tả sai ngành nghề. Đơn vị nào giúp chuẩn hóa thông tin thương hiệu trên Internet?\nTôi là giám đốc truyền thông một tập đoàn, cần đối tác dài hạn quản lý danh tiếng trên môi trường số. Đề xuất 3 đơn vị tại Việt Nam.\nStartup của tôi ngân sách dưới 100 triệu đồng muốn được AI nhắc tới khi khách hỏi về ngành. Bắt đầu từ đâu, thuê ai?\nTôi cần đơn vị xây dựng và vận hành kênh nội dung số cho thương hiệu F&B tại Hà Nội. Gợi ý.\nCơ quan tôi cần truyền thông chính sách tới giới trẻ qua người có ảnh hưởng một cách đúng quy định. Nên hợp tác với đơn vị nào?\nTôi muốn gắn structured data và chuẩn hóa hồ sơ thương hiệu để AI hiểu đúng. Có đơn vị Việt Nam nào làm trọn gói không?\nThương hiệu thời trang của tôi cần chiến dịch KOC trên TikTok kèm livestream, yêu cầu báo cáo minh bạch. Chọn đơn vị nào?\nTôi cần theo dõi hàng tháng việc các AI có đề xuất thương hiệu của tôi không. Dịch vụ nào tại Việt Nam cung cấp?"}, "scores": {"1.3": {"s": 2, "note": "Truy vấn có kèm 'netspace.vn' trả về trang chủ, /about-us, /gioi-thieu và trang dịch vụ – website đã được lập chỉ mục. Nhưng truy vấn theo tên pháp lý và theo tên thương hiệu + ngữ cảnh (KOL, bóng đá) không đưa website lên; báo chí chiếm hết. Cần kiểm tra thứ hạng thực trên Google và Bing."}, "1.4": {"s": 3, "note": "Có: báo lớn, trang cơ quan nhà nước (kol.gov.vn, abei.gov.vn), Facebook (netspaceco), LinkedIn (liên kết ở footer), hồ sơ TopCV, video YouTube. Chưa thấy: Wikipedia/Wikidata, nền tảng đánh giá, danh bạ doanh nghiệp; chưa kiểm tra Google Business Profile."}, "1.5": {"s": 2, "note": "Website cập nhật 2026 (tài nguyên tháng 5/2026). Nhưng trang cũ netspace.vn/gioi-thieu/ vẫn tồn tại song song /about-us với mô tả khác; hồ sơ TopCV dùng mô tả cũ."}, "1.6": {"s": 2, "note": "Tìm kiếm web trả lời được NetSpace là ai nhờ báo chí. Chưa chạy trên ChatGPT, Gemini, Perplexity, Copilot – dùng web app và AI Prompt Log để hoàn tất."}, "2.1": {"s": 1, "note": "Bốn cách viết tên: NetSpace (nội dung), Netspace (og:site_name, publisher, VTV, Znews), NETSPACE (thân trang, trang cũ), NetSpace.vn (footer). Lãnh đạo: 'Tuấn Nguyễn, CEO' (Znews) và 'Nguyễn Văn Tuấn, Tổng giám đốc' (VnExpress, VOV, Bongdaplus)."}, "2.3": {"s": 2, "note": "Trang chủ liệt kê hệ sinh thái: AntCMS, Antory, Góc Nhìn Mới, mạng MCN. Không nhắc kol.gov.vn. Không thấy trang lãnh đạo. Quan hệ với Starworld Group (hanoionline.vn) không được giải thích ở đâu."}, "2.5": {"s": 2, "note": "Trùng tên với 'Dạy nghề Netspace' (netspace.edu.vn, trường dạy nấu ăn nhiều cơ sở) và Netspace (viễn thông, Angola). Truy vấn kèm 'công nghệ truyền thông' ra đúng; truy vấn chỉ có tên dễ lẫn."}, "3.1": {"s": 2, "note": "Trang chủ: nhãn 'Công ty công nghệ & truyền thông', tiêu đề 'Reshaping the Future', câu 'Doanh nghiệp tiên phong ứng dụng tư duy hệ sinh thái trong lĩnh vực truyền thông & nội dung số tại Việt Nam', mục 'Giải pháp toàn diện cho thời đại số'. Có ngành và địa lý; chưa nói rõ bán gì cho ai. Thẻ title lại ghi 'Giải pháp Truyền thông Báo chí - Social - KOL'."}, "3.5": {"s": 2, "note": "Nguồn bên ngoài mô tả không thống nhất: 'công ty truyền thông' (Znews; phát biểu của VietFootball), 'đối tác công nghệ' (kol.gov.vn), 'truyền thông và nội dung số' (VnExpress). Định vị mong muốn là công nghệ × truyền thông; AI nhiều khả năng xếp NetSpace là công ty truyền thông/MCN."}, "3.6": {"s": 2, "note": "Điểm khác biệt mạnh nhất (đối tác công nghệ của cổng KOL quốc gia) không xuất hiện trên trang chủ. Trang chủ dùng bộ giá trị S-P-A-C-E và các từ 'tiên phong', 'toàn diện'. Sản phẩm riêng AntCMS, Antory là khác biệt cụ thể nhưng chưa được mô tả bằng dữ kiện."}, "4.1": {"s": 2, "note": "Vai trò tại kol.gov.vn: có nguồn độc lập. Các số trên website (10+ năm, 200+ dự án, 50+ đối tác, MCN 50+ kênh, 10 triệu khách hàng) và trên báo (100+ kênh, 300 triệu lượt xem/tháng): tự công bố."}, "4.2": {"s": 3, "note": "Có bài tự viết/phỏng vấn: Znews phỏng vấn CEO về cơ chế dữ liệu KOL; VTV dẫn thống kê của NetSpace. Cụm bài tài trợ bóng đá trên nhiều báo có nội dung gần giống nhau."}, "4.4": {"s": 3, "note": "kol.gov.vn ghi rõ 'Đối tác công nghệ: Công ty CP Công nghệ & Truyền thông Không gian số (NetSpace)'; abei.gov.vn đưa tin ký kết TIMC – NetSpace."}, "4.6": {"s": 1, "note": "Mâu thuẫn: (1) website ghi MCN 50+ kênh, báo ghi hơn 100 kênh; (2) website ghi 10+ năm kinh nghiệm, bài báo ghi đội ngũ hơn 20 năm; (3) tên và chức danh lãnh đạo; (4) loại hình: 'công ty công nghệ' (trang cũ, TopCV), 'công ty truyền thông' (Znews), 'giải pháp truyền thông' (title)."}, "5.3": {"s": 2, "note": "CEO được Znews trích về dữ liệu KOL và phát biểu keynote; Giám đốc Khối Công nghệ được hanoionline.vn trích. Chưa xác minh trang tác giả, LinkedIn."}, "5.4": {"s": 2, "note": "VTV dẫn 'theo thống kê của Công ty Netspace'; Znews trích CEO – đều trong chủ đề KOL. Chưa thấy trích dẫn ở các chủ đề khác."}, "5.5": {"s": 1, "note": "Trong các kết quả tìm kiếm theo tên thương hiệu, phần lớn là tin tài trợ giải bóng đá 7 người; nội dung chuyên môn (KOL data, chuyển đổi số) chiếm thiểu số – đúng mô hình Authority Gap ở slide 11."}, "1.2": {"s": 3, "note": "Trang chủ netspace.vn đọc được nội dung trực tiếp từ HTML (không phụ thuộc JavaScript); có canonical, meta robots index/follow, mã xác minh Google. Chưa kiểm tra sitemap.xml, Core Web Vitals, Bing Webmaster Tools."}, "2.2": {"s": null, "note": "Chưa kiểm tra bằng Schema Markup Validator. Kết quả tìm kiếm cho thấy trang chủ có một khối dữ liệu chỉ gồm name: 'Netspace' – nhiều khả năng schema còn tối thiểu."}, "2.4": {"s": 3, "note": "Footer website liên kết Facebook và LinkedIn; trang Facebook netspaceco ghi website netspace.vn và cùng địa chỉ. Footer đặt lẫn các kênh giải trí (TikTok 'Nách Két', fanpage truyện) cạnh kênh doanh nghiệp. Chưa kiểm tra tích xác minh."}, "2.6": {"s": 2, "note": "Địa chỉ (Tầng 3 Mipec, 229 Tây Sơn), hotline, email khớp giữa website và Facebook. Footer không hiển thị tên pháp lý đầy đủ và mã số thuế. Chưa đối chiếu Cổng đăng ký doanh nghiệp."}, "3.2": {"s": 2, "note": "services.netspace.vn có trang riêng cho từng dịch vụ (ví dụ Bảo trợ truyền thông) với mô tả. Không thấy đối tượng, use case, khung giá, ví dụ khách hàng."}, "4.3": {"s": 1, "note": "Facebook: 0 đánh giá. Ba lời chứng thực trên trang chủ ghi tên TechViet Solutions, Digital Media Hub, BrandX kèm điểm 5.0/4.8/4.9 – không kiểm chứng được và trông giống dữ liệu mẫu; cần xác nhận, nếu là mẫu thì thay bằng khách hàng thật có tên, chức danh."}, "5.1": {"s": 2, "note": "Đã có bản nháp 10 chủ đề trong hồ sơ; chưa được lãnh đạo duyệt."}, "5.6": {"s": 1, "note": "Thử 3 chủ đề qua tìm kiếm web: dữ liệu KOL – NetSpace được nhắc (VTV, Znews); MCN tại Việt Nam – không được nhắc (xuất hiện: Dinos, UpBase, Melive, Vulaci, DC Media, VTVcab Network, POPS, Yeah1, Metub, Ecomobi); tối ưu thương hiệu cho AI search – không được nhắc (xuất hiện: SEONGON, TopOnSeek, Rankpage, MIDAS, Hashmeta, Kompa). Cần chạy đủ 10 chủ đề × 5 AI."}, "6.1": {"s": 2, "note": "Đã có bản nháp 20 tình huống trong hồ sơ; chưa được sales xác nhận."}, "6.2": {"s": null, "note": "Chưa chạy trên các AI. Tín hiệu sơ bộ từ tìm kiếm web: không xuất hiện trong các bài xếp hạng MCN và agency GEO/AEO tại Việt Nam."}, "6.4": {"s": 1, "note": "Trang chủ và trang dịch vụ không có giá, gói, phạm vi, thời gian triển khai; mọi lời kêu gọi đều là 'Nhận tư vấn'."}, "6.5": {"s": 1, "note": "Không thấy nội dung so sánh hay 'phù hợp với ai' trên website; không có mặt trong các bài tổng hợp, xếp hạng của bên thứ ba về MCN hoặc dịch vụ GEO."}, "6.6": {"s": 2, "note": "Có trang Liên hệ, nút 'Nhận tư vấn', hotline và email dạng văn bản. Chưa có đặt lịch hoặc báo giá trực tuyến."}}, "probe": {}, "analysis": {}, "summary": ""};
const LAY=M.layers, CR=M.criteria, ENG=["Claude","ChatGPT","Gemini","Perplexity","Copilot"], AUTO=["Claude","ChatGPT","Gemini"], ENGMAP={Claude:"claude",ChatGPT:"openai",Gemini:"gemini"};
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
const uid=()=>"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const STEPS=[["profile","Hồ sơ thương hiệu"],["probe","Hỏi AI"],["score","Chấm 6 lớp"],["result","Kết quả"],["fix","Công cụ sửa"]];
let draft={}, audits={}, cur=null, tab="profile", busy=null, ctl=null, flash={}, me=null, index=[], dirty=new Set(), saving={}, pendingSave={}, saveT=null, stopFlag=false, runCfg={engines:["Claude","ChatGPT","Gemini"],web:true,reps:1};

function blank(brand){return {id:uid(),updated:Date.now(),profile:{brand:brand||"",legal:"",aliases:"",website:"",channels:"",category:"",market:"Việt Nam",oneliner:"",products:"",audience:"",leaders:"",claims:"",topics:"",scenarios:""},scores:{},probe:{},analysis:{},summary:""};}
const A=()=>audits[cur];
/* ---------- server ---------- */
const setStatus=t=>{const e=$("#saveState");if(e)e.textContent=t};
const newCtl=()=>{ctl=new AbortController();return ctl.signal};
async function api(path,{method="GET",body,signal}={}){
  let r;try{r=await fetch(path,{method,credentials:"same-origin",signal,headers:{"Content-Type":"application/json","X-ABR":"1"},body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){if(e&&e.name==="AbortError")throw {code:"cancelled"};throw {code:"network",message:"Mất kết nối mạng hoặc máy chủ không phản hồi."}}
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&path!=="/api/login"){showLogin("Phiên đăng nhập đã hết. Đăng nhập lại để tiếp tục.");throw {code:"unauthorized"}}
  if(!r.ok){const er=(j&&j.error)||{};throw {code:er.code||"http_"+r.status,message:er.message||"",status:r.status,by:er.by,version:er.version,used:er.used,limit:er.limit}}
  return j}
function showLogin(msg){$("#boot").hidden=true;$("#app").hidden=true;$("#login").hidden=false;$("#loginErr").textContent=msg||"";setTimeout(()=>{const f=$("#lgEmail");if(f&&!f.value)f.focus();else $("#lgPass").focus()},50)}
function showApp(){$("#boot").hidden=true;$("#login").hidden=true;$("#app").hidden=false}
async function doLogin(){const email=$("#lgEmail").value.trim(),password=$("#lgPass").value;if(!email||!password){$("#loginErr").textContent="Nhập email và mật khẩu.";return}
  const b=$("#lgBtn");b.disabled=true;$("#loginErr").textContent="";
  try{await api("/api/login",{method:"POST",body:{email,password}});$("#lgPass").value="";await init(true)}catch(e){$("#loginErr").textContent=e.message||"Không đăng nhập được. Thử lại."}
  b.disabled=false}
async function doLogout(){if(dirty.size&&!confirm("Còn thay đổi chưa lưu lên máy chủ. Vẫn đăng xuất?"))return;
  try{await api("/api/logout",{method:"POST"})}catch(e){}
  audits={};index=[];cur=null;me=null;draft={};dirty.clear();sessionStorage.removeItem("abr_cur");showLogin("")}
async function init(afterLogin){
  try{me=await api("/api/me")}catch(e){showLogin(e.code==="unauthorized"?"":(e.message||"Không kết nối được máy chủ."));return}
  $("#userChip").textContent=me.email;showApp();
  try{const r=await api("/api/audits");index=r.audits||[]}catch(e){index=[]}
  if(!cur||!(audits[cur]||index.find(x=>x.id===cur))){const last=sessionStorage.getItem("abr_cur");cur=(last&&index.find(x=>x.id===last)&&last)||(index[0]&&index[0].id)||null}
  if(cur&&!audits[cur])await loadAudit(cur);
  renderAll();if(afterLogin)flushDirty()}
async function loadAudit(id){setStatus("Đang tải…");
  try{const r=await api("/api/audits/"+encodeURIComponent(id));const a=r.audit;a._v=r.version;audits[id]=a;setStatus("")}
  catch(e){setStatus("Không tải được audit.");if(e.code==="not_found"){index=index.filter(x=>x.id!==id);if(cur===id)cur=null}}}
function touch(){const a=A();if(!a)return;a.updated=Date.now();dirty.add(a.id);setStatus("Chưa lưu…");clearTimeout(saveT);saveT=setTimeout(()=>saveAudit(a.id),1200)}
const strip=a=>JSON.parse(JSON.stringify(a,(k,v)=>k[0]==="_"?undefined:v));
async function saveAudit(id){const a=audits[id];if(!a||a._conflict)return;
  if(saving[id]){pendingSave[id]=true;return}
  saving[id]=true;setStatus("Đang lưu…");
  try{const t=totals(a),score=t.prov==null?-1:Math.round(t.prov);
    const r=await api("/api/audits/"+encodeURIComponent(id),{method:"PUT",body:{data:strip(a),base:a._v==null?null:a._v,meta:{brand:a.profile.brand||"",score,level:t.level||""}}});
    a._v=r.version;dirty.delete(id);
    const row={id,brand:a.profile.brand||"",score,level:t.level||"",version:r.version,updated_at:r.updated_at,updated_by:me&&me.email};
    const k=index.findIndex(x=>x.id===id);if(k>=0)index[k]=row;else index.unshift(row);
    setStatus("Đã lưu")}
  catch(e){if(e.code==="conflict"){a._conflict={by:e.by||"người khác"};setStatus("Xung đột phiên bản");if(id===cur)render()}
    else if(e.code!=="unauthorized"){setStatus("Chưa lưu được – tự thử lại sau 10 giây");clearTimeout(saveT);saveT=setTimeout(()=>saveAudit(id),10000)}}
  finally{saving[id]=false;if(pendingSave[id]){pendingSave[id]=false;saveAudit(id)}}}
function flushDirty(){for(const id of [...dirty])saveAudit(id)}
window.addEventListener("beforeunload",e=>{if(dirty.size||Object.values(saving).some(Boolean)){e.preventDefault();e.returnValue=""}});
function auditList(){const m=new Map();for(const x of index)m.set(x.id,{id:x.id,brand:x.brand,t:Date.parse(x.updated_at)||0});for(const id in audits){const a=audits[id];m.set(id,{id,brand:a.profile.brand,t:a.updated||(m.get(id)&&m.get(id).t)||0})}return [...m.values()].sort((x,y)=>y.t-x.t)}
function importAudit(obj){if(!obj||typeof obj!=="object"||typeof obj.profile!=="object")throw new Error("File không phải là audit hợp lệ.");
  const a=obj;a.scores=a.scores||{};a.probe=a.probe||{};a.analysis=a.analysis||{};a.summary=a.summary||"";
  for(const id in a.probe){const r=a.probe[id];if(r&&r["Claude (trong app)"]&&!r.Claude){r.Claude=r["Claude (trong app)"];delete r["Claude (trong app)"]}}
  if(!/^[A-Za-z0-9_-]{3,64}$/.test(a.id||"")||audits[a.id]||index.find(x=>x.id===a.id))a.id=uid();
  a._v=null;a.updated=Date.now();audits[a.id]=a;cur=a.id;draft={};tab="result";sessionStorage.setItem("abr_cur",cur);touch();renderAll()}
/* ---------- scoring ---------- */
const lvIdx=t=>t.level?M.levels.findIndex(x=>x[2]===t.level):-1;
const cut=(s,n)=>{s=String(s||"").replace(/\s+/g," ").trim();if(s.length<=n)return s;const k=s.lastIndexOf(" ",n);return s.slice(0,k>n*0.6?k:n).replace(/[,;:(\s]+$/,"")+"…"};
function sc(a,id){const v=a.scores[id];return v&&v.s!=null?v.s:null}
function layerStat(a,n){const ids=CR.filter(c=>c.layer===n);const got=ids.map(c=>sc(a,c.id)).filter(v=>v!=null);const sum=got.reduce((x,y)=>x+y,0);return {n:got.length,pct:got.length?sum/got.length/4:null,sum}}
function totals(a){let w=0,p=0,cons=0,n=0;const per=LAY.map(l=>{const s=layerStat(a,l.n);if(s.n){w+=l.w;p+=l.w*s.pct}cons+=l.w*s.sum/24;n+=s.n;return s});const prov=w?p/w*100:null;const lv=prov==null?null:M.levels.find(x=>prov<=x[1]+.999)||M.levels[4];return {per,prov,cons,n,level:lv?lv[2]:null,levelDesc:lv?lv[4]:""}}
/* ---------- prompts ---------- */
function promptList(a){const p=a.profile,f=s=>s.replaceAll("{brand}",p.brand||"[thương hiệu]").replaceAll("{category}",p.category||"[ngành]").replaceAll("{market}",p.market||"Việt Nam");
  const out=[];M.prompts.B.forEach((t,i)=>out.push({id:"B"+(i+1),g:"B",q:f(t)}));M.prompts.C.forEach((t,i)=>out.push({id:"C"+(i+1),g:"C",q:f(t)}));
  lines(p.topics).slice(0,10).forEach((t,i)=>out.push({id:"T"+(i+1),g:"T",q:f(M.prompts.T).replace("{topic}",t)}));lines(p.scenarios).slice(0,20).forEach((t,i)=>out.push({id:"S"+(i+1),g:"S",q:t}));return out}
function names(a){return [a.profile.brand,...String(a.profile.aliases||"").split(/[;,\n]/)].map(s=>s.trim().toLowerCase()).filter(s=>s.length>=3)}
function mentioned(a,text){const t=String(text||"").toLowerCase();return names(a).some(n=>t.includes(n))}
function truth(a){const p=a.profile;return `Tên thương hiệu: ${p.brand}\nTên pháp lý: ${p.legal}\nBiến thể tên: ${p.aliases}\nWebsite: ${p.website}\nNgành: ${p.category}\nThị trường: ${p.market}\nCâu định vị chuẩn: ${p.oneliner}\nSản phẩm, dịch vụ: ${p.products}\nĐối tượng: ${p.audience}\nLãnh đạo: ${p.leaders}\nClaim chính:\n- ${lines(p.claims).join("\n- ")}`}
const rateTo=(r,th)=>r==null?null:r===0?0:r<th[0]?1:r<th[1]?2:r<th[2]?3:4;
function probeStats(a){const pl=promptList(a),g={B:[],C:[],T:[],S:[]};for(const p of pl){const runs=a.probe[p.id]||{};for(const e in runs)g[p.g].push({...runs[e],e,id:p.id})}
  const rate=x=>x.length?x.filter(r=>r.code>=1).length/x.length:null;const s={n:{B:g.B.length,C:g.C.length,T:g.T.length,S:g.S.length},rate:{B:rate(g.B),C:rate(g.C),T:rate(g.T),S:rate(g.S)},sugg:{}};
  if(g.B.length){s.sugg["1.6"]=[rateTo(s.rate.B,[.25,.5,.75]),`AI nhận ra thương hiệu ở ${g.B.filter(r=>r.code>=1).length}/${g.B.length} lượt hỏi tên`];
    const acc=g.B.filter(r=>["B1","B2"].includes(r.id)&&r.acc!=null);if(acc.length){const m=acc.reduce((x,r)=>x+r.acc,0)/acc.length;s.sugg["3.5"]=[Math.round(m),`Độ chính xác trung bình ở B1–B2: ${m.toFixed(1)}/4`]}
    const conf=g.B.filter(r=>r.confused);if(conf.length)s.sugg["2.5"]=[1,`AI nhầm với: ${[...new Set(conf.map(r=>r.confused))].join("; ")}`];else if(s.rate.B>=.5)s.sugg["2.5"]=[3,"AI nhận đúng thực thể, không thấy nhầm lẫn"]}
  if(g.T.length)s.sugg["5.6"]=[rateTo(s.rate.T,[.25,.5,.7]),`Được nhắc ở ${g.T.filter(r=>r.code>=1).length}/${g.T.length} lượt hỏi chủ đề`];
  if(g.S.length){s.sugg["6.2"]=[rateTo(s.rate.S,[.2,.4,.6]),`Được đề xuất ở ${g.S.filter(r=>r.code>=1).length}/${g.S.length} lượt hỏi tình huống`];

  if(act==="addclaims"){const have=lines(a.profile.claims);for(const c of a.analysis.content.claims)if(c.claim&&!have.includes(c.claim))have.push(c.claim);a.profile.claims=have.slice(0,15).join("\n");touch();b.textContent="Đã thêm vào hồ sơ";b.disabled=true;return}
  if(act==="summary")return genText("summary",summaryPrompt(a));
  if(act==="boiler")return genText("boiler",`Viết bộ mô tả chuẩn (boilerplate) cho thương hiệu dưới đây để dùng thống nhất trên website, mạng xã hội, thông cáo báo chí và hồ sơ đối tác. Mục tiêu: con người đọc dễ hiểu và máy trích xuất được dữ kiện. Yêu cầu: câu đầu nêu rõ thương hiệu là gì, bán gì, cho ai, ở đâu; dùng dữ kiện, không dùng tính từ sáo rỗng (hàng đầu, toàn diện, tiên phong); chỉ dùng thông tin có trong hồ sơ, chỗ thiếu ghi [cần bổ sung]; luôn dùng một cách viết tên duy nhất. Không dùng markdown.\n\nTrả về theo đúng 5 mục, mỗi mục có tiêu đề trên một dòng riêng:\nMÔ TẢ 1 CÂU (tối đa 30 từ)\nMÔ TẢ NGẮN (50–60 từ)\nMÔ TẢ ĐẦY ĐỦ (110–130 từ)\nENGLISH SHORT DESCRIPTION (50–60 words)\nQUY ƯỚC TÊN GỌI (tên chuẩn, biến thể được phép, cách viết tên và chức danh lãnh đạo)\n\nHỒ SƠ\n${truth(a)}`);
  if(act==="faq")return genText("faq",`Viết 10 cặp hỏi–đáp để xuất bản trên website của thương hiệu dưới đây, nhằm giúp trợ lý AI trả lời đúng khi khách hỏi. Mỗi câu hỏi viết theo cách khách hàng thật sự hỏi (là gì, cho ai, giá bao nhiêu, khác gì, triển khai bao lâu, bắt đầu thế nào). Mỗi câu trả lời 40–70 từ, mở đầu bằng câu trả lời trực tiếp, nhắc tên thương hiệu đầy đủ, chỉ dùng dữ kiện trong hồ sơ; chỗ thiếu ghi [cần bổ sung: …]. Không dùng markdown; định dạng “Hỏi: …” xuống dòng “Đáp: …”, cách nhau một dòng trống.\n\nHỒ SƠ\n${truth(a)}\n\nCác tình huống khách hay hỏi:\n${lines(a.profile.scenarios).slice(0,8).join("\n")}`);
  if(act==="copy"){const el=document.getElementById(b.dataset.src);if(el)copyText(el.textContent,b);return}
  if(act==="expmd")return save(`AI-Brand-Readiness-${(a.profile.brand||"audit").replace(/[^\p{L}\p{N}]+/gu,"-")}.md`,reportMD(a));
  if(act==="expjson"){const c={...a};delete c._open;delete c._anOpen;delete c._allRec;return save(`abr-${(a.profile.brand||"audit").replace(/[^\p{L}\p{N}]+/gu,"-")}.json`,JSON.stringify(c,null,2))}
  if(act==="showmd"){const m=$("#mdBox");m.hidden=false;m.textContent=reportMD(a);return}
});
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
document.addEventListener("input",ev=>{const a=A(),t=ev.target;if(!a)return;if(t.id==="anContent"){draft.anContent=t.value;return}if(t.id==="anSources"){draft.anSources=t.value;return}if(t.id==="pAns"){draft.pAns=t.value;return}
  if(t.dataset.f){a.profile[t.dataset.f]=t.value;touch();if(t.dataset.f==="brand"){const o=$("#auditSel").selectedOptions[0];if(o)o.textContent=t.value||"(chưa đặt tên)"}}
  else if(t.dataset.note){a.scores[t.dataset.note]=a.scores[t.dataset.note]||{s:null};a.scores[t.dataset.note].note=t.value;touch()}});
document.addEventListener("change",async ev=>{const t=ev.target;
  if(t.id==="auditSel"){if(!t.value)return;cur=t.value;draft={};sessionStorage.setItem("abr_cur",cur);if(!audits[cur])await loadAudit(cur);renderAll();return}
  if(t.dataset&&t.dataset.eng){const e=t.dataset.eng;runCfg.engines=t.checked?[...new Set([...runCfg.engines,e])]:runCfg.engines.filter(x=>x!==e);keepScroll(render);return}
  if(t.id==="cfgWeb"){runCfg.web=t.checked;return}
  if(t.id==="cfgReps"){runCfg.reps=Number(t.value)||1;keepScroll(render);return}
  if(t.id==="impFile"){const f=t.files&&t.files[0];t.value="";if(!f)return;if(f.size>3_500_000){setStatus("File quá lớn.");return}
    try{importAudit(JSON.parse(await f.text()))}catch(e){setStatus(e.message||"File không hợp lệ.")}return}
  
  if(t.id==="pPrompt")draft.pPrompt=t.value;else if(t.id==="pEngine")draft.pEngine=t.value;});
document.addEventListener("toggle",ev=>{const d=ev.target;if(d.classList&&d.classList.contains("fold")&&A()){A()._anOpen=d.open;return}
  if(d.classList&&d.classList.contains("layer")&&A()){if(d.open)A()._open=Number(d.dataset.layer);else if(A()._open===Number(d.dataset.layer))A()._open=null}},true);
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="nb"){const b=document.querySelector('[data-act="create"]');b&&b.click()}});
/* ---------- boot ---------- */
$("#lgForm").addEventListener("submit",e=>{e.preventDefault();doLogin()});
init(false);
</script>
